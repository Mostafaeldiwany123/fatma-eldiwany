<!DOCTYPE html>
<html lang="ar" class="scroll-smooth">

<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
  <title>Prof. Fatma El-Diwany</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Zain:wght@200;300;400;700;800;900&display=swap"
    rel="stylesheet">
  <link rel="icon" type="image/svg+xml" href="favicon.svg" />
  <script>
    tailwind.config = {
      theme: {
        extend: {
          colors: {
            paper: '#FDFBF7',
            ink: '#1A1A1A',
            gold: '#C5A059',
            'gold-light': '#E6C885',
            'gold-dark': '#96783C',
            charcoal: '#2D2D2D',
          },
          fontFamily: {
            serif: ['"Playfair Display"', 'serif'],
            sans: ['"Inter"', 'sans-serif'],
            display: ['"Cormorant Garamond"', 'serif'],
            arabic: ['"Zain"', 'sans-serif'],
          }
        }
      }
    }
  </script>
  <style>
    :root {
      --font-main: 'Inter', sans-serif;
      --font-heading: 'Playfair Display', serif;
    }

    /* Global Arabic Overrides */
    [lang="ar"] {
      --font-main: 'Zain', sans-serif;
      --font-heading: 'Zain', sans-serif;
    }

    html {
      scroll-padding-top: 100px;
      scroll-behavior: smooth;
    }

    body {
      font-family: var(--font-main);
      background-color: #FDFBF7;
      color: #1A1A1A;
    }

    h1,
    h2,
    h3,
    h4,
    h5,
    h6 {
      font-family: var(--font-heading);
    }

    /* Ensure specific Tailwind classes also respect the global font when in Arabic */
    [lang="ar"] .font-serif,
    [lang="ar"] .font-sans,
    [lang="ar"] .font-display {
      font-family: 'Zain', sans-serif !important;
    }

    .glass-nav {
      background: rgba(253, 251, 247, 0.95);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    }

    /* 3D Book Styles */
    .book-container {
      perspective: 1500px;
      display: flex;
      justify-content: center;
      align-items: center;
    }

    .book {
      transform-style: preserve-3d;
      transform: rotateY(-20deg) rotateX(5deg);
      transition: transform 0.5s ease;
      box-shadow: 20px 20px 30px -10px rgba(0, 0, 0, 0.3);
    }

    .book-spine {
      position: absolute;
      top: 0;
      bottom: 0;
      left: 0;
      width: 50px;
      transform: rotateY(90deg) translateZ(-25px);
      background: linear-gradient(90deg, #222 0%, #333 30%, #111 100%);
      box-shadow: inset 4px 0 10px rgba(0, 0, 0, 0.5);
    }

    .book-pages {
      position: absolute;
      top: 4px;
      bottom: 4px;
      right: -15px;
      width: 50px;
      transform: rotateY(90deg) translateZ(-22px);
      background: #fff;
      background-image:
        linear-gradient(to right, rgba(0, 0, 0, 0.1), transparent),
        repeating-linear-gradient(90deg, #f9f9f9 0px, #f9f9f9 1px, #fff 1px, #fff 3px);
    }
  </style>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
