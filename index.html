<!DOCTYPE html>
<html lang="en" class="scroll-smooth">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=0" />
    <title>Prof. Fatma El-Diwany</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;0,500;0,600;0,700;1,400;1,500&family=Inter:wght@300;400;500;600&family=Cormorant+Garamond:ital,wght@0,300;0,400;0,600;1,400&family=Zain:wght@200;300;400;700;800;900&display=swap" rel="stylesheet">
    <script>
      tailwind.config = {
        theme: {
          extend: {
            colors: {
              paper: '#FDFBF7',
              ink: '#1A1A1A',
              gold: '#C5A059',
              'gold-light': '#E6C885',
              'gold-dark': '#96783C',
              charcoal: '#2D2D2D',
            },
            fontFamily: {
              serif: ['"Playfair Display"', 'serif'],
              sans: ['"Inter"', 'sans-serif'],
              display: ['"Cormorant Garamond"', 'serif'],
              arabic: ['"Zain"', 'sans-serif'],
            }
          }
        }
      }
    </script>
    <style>
      html {
        scroll-padding-top: 100px; /* Offset for fixed navbar */
        scroll-behavior: smooth;
      }
      body {
        font-family: 'Inter', sans-serif;
        background-color: #FDFBF7;
        color: #1A1A1A;
      }
      h1, h2, h3, h4, h5, h6 {
        font-family: 'Playfair Display', serif;
      }
      .glass-nav {
        background: rgba(253, 251, 247, 0.95);
        backdrop-filter: blur(12px);
        -webkit-backdrop-filter: blur(12px);
        border-bottom: 1px solid rgba(0, 0, 0, 0.05);
      }
      /* 3D Book Styles */
      .book-container {
        perspective: 1500px;
        display: flex;
        justify-content: center;
        align-items: center;
      }
      .book {
        transform-style: preserve-3d;
        transform: rotateY(-20deg) rotateX(5deg);
        transition: transform 0.5s ease;
        box-shadow: 20px 20px 30px -10px rgba(0,0,0,0.3);
      }
      
      .book-spine {
        position: absolute;
        top: 0;
        bottom: 0;
        left: 0;
        width: 50px;
        transform: rotateY(90deg) translateZ(-25px);
        background: linear-gradient(90deg, #222 0%, #333 30%, #111 100%);
        box-shadow: inset 4px 0 10px rgba(0,0,0,0.5);
      }
      .book-pages {
        position: absolute;
        top: 4px;
        bottom: 4px;
        right: -15px;
        width: 50px;
        transform: rotateY(90deg) translateZ(-22px);
        background: #fff;
        background-image: 
            linear-gradient(to right, rgba(0,0,0,0.1), transparent),
            repeating-linear-gradient(90deg, #f9f9f9 0px, #f9f9f9 1px, #fff 1px, #fff 3px);
      }
    </style>
  <script type="importmap">
{
  "imports": {
    "framer-motion": "https://aistudiocdn.com/framer-motion@^12.23.24",
    "react/": "https://aistudiocdn.com/react@^19.2.0/",
    "react": "https://aistudiocdn.com/react@^19.2.0",
    "react-dom/": "https://aistudiocdn.com/react-dom@^19.2.0/",
    "lucide-react": "https://aistudiocdn.com/lucide-react@^0.555.0"
  }
}
</script>
</head>
  <body>
    <div id="root"></div>
  </body>
</html>
